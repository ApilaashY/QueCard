version: "3.8"

services:
  # Your Next.js Application
  # Requires: supabase start (run separately via Supabase CLI)
  web:
    image: quecard-app:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Read environment variables directly from your .env file
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL:-http://host.docker.internal:54321}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - REDIS_URL=redis://my-redis-cache:6379
    depends_on:
      my-redis-cache:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway" # Linux support (Mac works without this)

  # Redis Cache
  my-redis-cache:
    image: redis:7-alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
